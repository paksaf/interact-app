name: interact
description: "INTERACT — voice/video-first, offline-capable, AI-assisted communication super-app. Free, open-source (AGPLv3), Pakistan-first."
publish_to: "none"
version: 0.5.25+6069

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.6

  # ── Push (FCM) — background/killed call ring. Reuses the interact-lifestyle
  #    Firebase project; needs android/app/google-services.json to build. ──
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # ── State + nav ─────────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0

  # ── Storage ─────────────────────────────────────────────────────────
  shared_preferences: ^2.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.0
  flutter_secure_storage: ^9.2.0

  # ── Networking ──────────────────────────────────────────────────────
  http: ^1.2.0

  # ── Realtime ────────────────────────────────────────────────────────
  # Pinned to livekit_client 2.8.1's exact flutter_webrtc 1.4.0 (VideoProcessor
  # Options fix is in livekit ≥2.6.5; ^1.4.1 resolves to 1.5.x which only
  # pairs with livekit 2.9.0-dev). Shared native libwebrtc for 1:1 mesh + SFU.
  flutter_webrtc: 1.4.0
  web_socket_channel: ^3.0.3

  # ── Conferences / townhalls (LiveKit SFU) ───────────────────────────
  # Multi-party path — flutter_webrtc above also serves the 1:1 LAN mesh
  # (meeting_room_screen.dart). SFU path: live_room_screen + livekit_service.
  # 2.8.1: setProcessor() uses VideoProcessorOptions for video tracks.
  livekit_client: 2.8.1

  # ── Phone OTP / sign-in ─────────────────────────────────────────────
  pin_code_fields: ^8.0.1

  # ── In-call / read-aloud ────────────────────────────────────────────
  wakelock_plus: ^1.2.0
  # Nearby mesh keep-alive (Maps donor BackgroundGpsService pattern).
  flutter_background_service: ^5.0.5

  # ── Invite-code scanning + display ──────────────────────────────────
  # 6.x uses Google ML Kit 7 on iOS — required to coexist with
  # google_mlkit_selfie_segmentation 0.9 (ML Kit 7). 5.x pins ML Kit 6
  # and CocoaPods cannot resolve both.
  mobile_scanner: ^6.0.11
  qr_flutter: ^4.1.0

  # ── Voice messages ──────────────────────────────────────────────────
  # `record` for capture, `audioplayers` for playback. Both AGPL-clean.
  record: ^5.1.0
  audioplayers: ^6.0.0

  # ── External URLs (Forgejo / license / open-source links) ──────────
  url_launcher: ^6.2.5

  # ── Share sheet (invite recipients via any app) ────────────────────
  # Uses Android's ACTION_SEND chooser — bypasses the "Always use" trap
  # that url_launcher(sms:) hits when an app like WhatsApp is set as
  # default for the sms: scheme. Each tap shows a fresh app picker.
  # Added 2026-05-23 (#163).
  share_plus: ^10.0.0

  # ── Ringtone for incoming calls (FaceTime-style) ────────────────────
  # Plays the device's default ringtone on a loop while the incoming-call
  # screen is up — no bundled audio asset needed. Used by call_signaling.dart
  # + incoming_call_screen.dart.
  flutter_ringtone_player: ^4.0.0+3

  # ── Local notifications (message banner + sound) ───────────────────
  # New-message notifications while the app runs: a high-importance channel
  # shows a heads-up banner AND plays the system notification sound (no extra
  # audio asset needed). message_watcher.dart polls threads and fires these
  # for inbound messages outside the open chat. Background/killed-app push is
  # a later FCM add — this covers foreground/recent-background today.
  flutter_local_notifications: ^17.2.3

  # ── Native incoming-call screen (WhatsApp-style, over lock screen) ──
  # flutter_callkit_incoming shows a NATIVE full-screen incoming call even when
  # the app is KILLED (Android custom UI / iOS CallKit), plus a native "Missed
  # call — Call back" notification. Fired from push_service.dart on a
  # `call_ring` FCM data message — works from the FCM background isolate
  # (changelog 3.1.0 added the background-message handler; 3.1.1 fixed calls
  # being silently dropped). 3.1.x requires Dart >=3.0 / Flutter >=3.10
  # (we are 3.6 / 3.27) and Java 17 (we compile with 17). The plugin ships its
  # own permissions/services/activities via manifest-merge; only INTERNET is
  # app-side (already declared). The in-app poll ring (call_signaling →
  # IncomingCallScreen) stays the FOREGROUND surface — CallKit is only used for
  # the killed / locked / background path (see callkit_service.dart).
  flutter_callkit_incoming: ^3.1.1

  # ── AI audit log — SHA-256 hashes of prompts/responses ─────────────
  crypto: ^3.0.3

  # ── Encrypted chat backup (#115) ────────────────────────────────────
  # Pure-Dart PBKDF2-HMAC-SHA256 (passphrase → key) + AES-GCM (auth-
  # encrypt the exported chat bundle). `crypto` above only hashes; this
  # adds symmetric encryption. Backup blob is uploaded to the VPS
  # (qurbanisahulat /api/v1/talk/backup) as opaque base64 — the server
  # never sees the passphrase or plaintext. See backup_service.dart.
  cryptography: ^2.7.0

  # ── Signal E2E (Phase 1.5) — pure-Dart libsignal; gated by install + flag ──
  libsignal_protocol_dart: ^0.8.2

  # ── VPS auto-update (side-load channel) ─────────────────────────────
  # update_service.dart checks downloads.interactpak.com/interact/latest.json,
  # compares versionCode (package_info_plus), and on a newer build opens the
  # APK URL via url_launcher (already a dep) so the browser downloads it + the
  # OS installer runs (REQUEST_INSTALL_PACKAGES). NOT ota_update — it pins a low
  # compileSdk that breaks Android resource linking.
  package_info_plus: ^8.0.0

  # ── Location personalisation ────────────────────────────────────────
  # Coarse GPS → nearest-city label ("Good evening · Multan"). Pinned to the
  # same major interact-maps uses (12.x) to stay lockstep across the fleet's
  # Flutter toolchain. Reverse-geocode is OFFLINE (embedded gazetteer in
  # location_service.dart) — no `geocoding` platform dependency. The fix never
  # leaves the device.
  geolocator: ^12.0.0

  # ── Device contacts (invite-from-address-book) ──────────────────────
  # Lets the user pick someone from their phone's address book to start a
  # chat or invite. Read-only usage (fetch with phones); we never write or
  # upload the address book — the chosen number goes straight to
  # createDirectThread / InviteSheet, same as the manual-entry path.
  # Path dep: pub 1.1.9+2 force-unwraps AppDelegate.window in register() and
  # EXC_BREAKPOINTs under UISceneDelegate (flutter_contacts#209/#230). Local
  # copy patches register() to resolve the root VC from connected scenes.
  # Cap stays on 1.x — 2.x needs Flutter≥3.32 and breaks with use_frameworks!
  # module clashes on this project's iOS embedding.
  flutter_contacts:
    path: packages/flutter_contacts

  # ── Camera effects / virtual background (Zoom/Meet-style) ───────────
  # Pinned to the same majors interact-maps ships (READ-only donor whose
  # camera→InputImage pipeline we borrow). `camera` drives the preview +
  # image stream; `google_mlkit_selfie_segmentation` produces the person mask
  # we composite over a blur/brand background. maps uses face_detection; we
  # swap the detector for the selfie segmenter — same CameraImage→InputImage
  # conversion (_toInputImage), so the known-good integration carries over.
  camera: ^0.11.2
  google_mlkit_selfie_segmentation: ^0.9.0

  # ── Chat media attachments (#114) ───────────────────────────────────
  # Pick photos/videos (image_picker) and any file incl. audio/docs
  # (file_picker), 50 MB client-side guard, upload to qurbanisahulat
  # /api/v1/media/upload, send the returned URL as the message attachment.
  image_picker: ^1.1.2
  file_picker: ^8.1.2

  # ── Inline video playback for chat attachments ─────────────────────
  # Official Flutter plugin. Video message attachments play INSIDE the
  # app (tap thumbnail → inline VideoPlayer with play/pause) instead of
  # launching an external browser. 2.9.x targets Flutter >=3.16 / Dart
  # >=3.3 — compatible with our 3.27 / 3.6 toolchain (do NOT bump to a
  # version needing a newer SDK). See _InlineVideo in chat_thread_screen.
  video_player: ^2.9.2

  # ── Offline LAN discovery (Phase 1.5) ───────────────────────────────
  # Bonsoir mDNS broadcast/discover. Combined with flutter_webrtc, this
  # enables peer-to-peer audio/video/text without ANY internet —
  # INTERACT's primary moat vs Zoom / WhatsApp / Signal / Viber.
  bonsoir: ^5.1.0

  # ── Shared INTERACT primitives ──────────────────────────────────────
  # TODO: rename sahulat_common → interact_common when migrating the 4
  # Sahulat sub-apps in a dedicated session. For now, path-reference
  # the existing package (provides ApiClient, theme, Whisper STT,
  # TtsService, LanguageController).
  sahulat_common:
    path: ../sahulat_common

  # ── Offline BLE mesh (SAHL donor) ───────────────────────────────────
  # Gossip text without internet. BleTransport is imported via
  # package:sahl_mesh/sahl_mesh_ble.dart (Flutter-only barrel).
  sahl_mesh:
    path: ../sahl_mesh
  nearby_service: ^0.2.1
  # BSD-3 BLE (commercial-safe). Replaces flutter_blue_plus — see
  # docs/COMMERCIAL_DEPS_AND_RF_PK.md + sahl_mesh/docs/LICENSE_DECISION.md
  flutter_reactive_ble: ^5.5.0
  # 1.0.0 lacks AGP namespace → Android release build fails on modern Gradle.
  # 2.x matches the walkie GATT API (clearServices, deviceId on write callback).
  ble_peripheral: ^2.4.0
  permission_handler: ^11.3.0
  dio: ^5.11.0
  open_filex: ^4.7.0
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5

# `record` 5.x pulls record_linux 0.7.2 which is missing the
# `startStream` + new `hasPermission` signature added by the
# record_platform_interface 1.5.0 contract. record_linux 1.3.0 fixes
# both. We don't actually USE Linux here (Android/iOS only) but the
# Dart resolver chokes anyway. Same override interact_pro uses.
dependency_overrides:
  # 2026-08-27 (evening): flutter_webrtc REVERTED 1.6.0 → 1.4.0. The 1.6
  # upgrade was made chasing the black-tile bug, whose true cause was the
  # busy-banner Stack collapse (CASE_TALK_BLACK_VIDEO_2026-08-27) — the
  # renderer was innocent. 1.5+'s AVAudioEngine ADM broke call audio BOTH
  # ways on iOS (audioBytes out=0, playout silent; upstream shape:
  # flutter-webrtc#1996). 1.4.0's ADM is the version this app's audio has
  # always worked on. RTCVideoPlatFormView (iOS renderer) exists in 1.4 too.
  record_linux: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.7

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/backgrounds/

flutter_launcher_icons:
  android: true          # overwrite the default ic_launcher mipmaps (AndroidManifest uses @mipmap/ic_launcher)
  ios: true
  image_path: "assets/icons/interact_icon.png"
  min_sdk_android: 23
  remove_alpha_ios: true
